name: Spaces GhosttyKit

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag override"
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ZIG_VERSION: 0.15.2
    steps:
      - name: Check out spaces branch
        uses: actions/checkout@v4
        with:
          ref: spaces
          fetch-depth: 0

      - name: Set release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="build-$(date -u +%Y-%m-%d)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          zig version
          xcodebuild -version

      - name: Build GhosttyKit
        run: |
          set -euo pipefail
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false

      - name: Package GhosttyKit artifacts
        run: |
          set -euo pipefail
          tar czf GhosttyKit.xcframework.tar.gz -C macos GhosttyKit.xcframework
          tar czf GhosttyKit-resources.tar.gz -C zig-out/share ghostty terminfo

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          git tag -f "$RELEASE_TAG" "$commit_sha"
          git push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "Spaces GhosttyKit build"
            echo
            echo "- source branch: spaces"
            echo "- fork commit: $(git rev-parse HEAD)"
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

          gh release upload "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            GhosttyKit.xcframework.tar.gz \
            GhosttyKit-resources.tar.gz \
            --clobber
