name: Spaces GhosttyKit

on:
  push:
    branches:
      - spaces
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spaces-ghosttykit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/spaces'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ZIG_VERSION: 0.15.2
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag from commit
        id: tag
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          echo "tag=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          zig version
          xcodebuild -version

      - name: Build GhosttyKit
        run: |
          set -euo pipefail
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false

      - name: Package GhosttyKit artifacts
        run: |
          set -euo pipefail
          tar czf GhosttyKit.xcframework.tar.gz -C macos GhosttyKit.xcframework
          tar czf GhosttyKit-resources.tar.gz -C zig-out/share ghostty terminfo

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_TAG" != "$commit_sha" ]]; then
            echo "release tag $RELEASE_TAG does not match checked out commit $commit_sha" >&2
            exit 1
          fi

          remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [[ -n "$remote_tag" ]]; then
            if [[ "$remote_tag" != "$commit_sha" ]]; then
              echo "remote release tag $RELEASE_TAG points at $remote_tag, expected $commit_sha" >&2
              exit 1
            fi
            echo "release tag $RELEASE_TAG already exists"
            exit 0
          fi

          git tag "$RELEASE_TAG" "$commit_sha"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "Spaces GhosttyKit build"
            echo
            echo "- source branch: ${GITHUB_REF_NAME:-spaces}"
            echo "- fork commit: $(git rev-parse HEAD)"
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

          gh release upload "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            GhosttyKit.xcframework.tar.gz \
            GhosttyKit-resources.tar.gz \
            --clobber
